name: CLI checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cli-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Validate translation catalogs
        run: |
          python3 scripts/check-i18n.py
          python3 scripts/test_i18n_checks.py
      - name: Check formatting
        run: mise exec -- cargo fmt --all --check
      - name: Test CLI and library
        run: mise exec -- cargo test --locked
      - name: Check lints
        run: mise exec -- cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check packaged locale files
        run: |
          mise exec -- cargo package --list --locked > package-files.txt
          grep -Fx 'locales/en.json' package-files.txt
          grep -Fx 'locales/zh-CN.json' package-files.txt
          grep -Fx 'README.zh-CN.md' package-files.txt
