[package]
name = "lmm-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Rust CLI for Language Model Mesh: provider presets, discovery, and read-only OAuth"
license = "AGPL-3.0-only"
publish = ["crates-io"]
repository = "https://github.com/TokenNotIncluded/lmm"
homepage = "https://api.lmm.best"
readme = "README.md"
keywords = ["lmm", "cli", "oauth", "ai"]
categories = ["command-line-utilities"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "README.zh-CN.md", "locales/**", "mise.toml", "LICENSE", "src/**", "tests/**", "docs/**", "NOTICE", "third_party/**", "scripts/*.py"]

[lib]
name = "lmm"
path = "src/lib.rs"

[[bin]]
name = "lmm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zhex = { git = "https://github.com/LIghtJUNction/zhex.git" }
thiserror = "2.0.21"
base64 = "0.23.1"
rand = "0.10.3"
url = "2.5.8"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "rustls"] }
webpki-root-certs = "1.0.12"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
fs2 = "0.4.3"
open = "5.4.5"
httparse = "1.10.1"
zeroize = { version = "1.9.1", features = ["derive"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
toml = { version = "=1.2.1", default-features = false, features = ["std", "serde", "parse"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true
